<!doctype html> <html lang="en"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <meta http-equiv="X-UA-Compatible" content="ie=edge" /> <title>Web Push Test</title> </head> <body> <button id="subscribeButton">Subscribe</button>
<script>
  const VAPID_PUBLIC_KEY =
    "BDweQvJ4xUnNXfFIngkobRaFgS7R971e-oJR7XmKASU8K_ERi1aa-_wMsZh92DTxO9EuXYx5i8AhpHlo6I9s1dc";

  function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat(
      (4 - (base64String.length % 4)) % 4
    );

    const base64 = (base64String + padding)
      .replace(/-/g, "+")
      .replace(/_/g, "/");

    const rawData = atob(base64);

    return Uint8Array.from(
      rawData,
      (char) => char.charCodeAt(0)
    );
  }

  async function subscribe() {
    try {
      console.log("Starting push subscription...");

      // Basic environment diagnostics
      const diagnostics = {
        secureContext: window.isSecureContext,
        serviceWorker: "serviceWorker" in navigator,
        pushManager: "PushManager" in window,
        notification: "Notification" in window,
        notificationPermission:
          "Notification" in window
            ? Notification.permission
            : "unsupported",
      };

      console.log("Environment:", diagnostics);

      if (!window.isSecureContext) {
        throw new Error(
          "Push notifications require HTTPS or localhost."
        );
      }

      if (!("serviceWorker" in navigator)) {
        throw new Error(
          "Service workers are not supported by this browser."
        );
      }

      if (!("PushManager" in window)) {
        throw new Error(
          "Push API is not supported by this browser."
        );
      }

      // Ask for notification permission first.
      if (Notification.permission === "default") {
        const permission = await Notification.requestPermission();

        console.log("Notification permission:", permission);

        if (permission !== "granted") {
          throw new Error(
            "Notification permission was not granted."
          );
        }
      }

      if (Notification.permission !== "granted") {
        throw new Error(
          `Notification permission is "${Notification.permission}".`
        );
      }

      // Wait for the service worker.
      const registration =
        await navigator.serviceWorker.ready;

      console.log(
        "Service worker ready:",
        registration
      );

      // Convert Base64URL VAPID public key into Uint8Array.
      const applicationServerKey =
        urlBase64ToUint8Array(VAPID_PUBLIC_KEY);

      console.log(
        "VAPID key length:",
        applicationServerKey.length
      );

      if (applicationServerKey.length !== 65) {
        throw new Error(
          `Invalid VAPID public key. Expected 65 bytes, got ${applicationServerKey.length}.`
        );
      }

      // Check whether we already have a subscription.
      let subscription =
        await registration.pushManager.getSubscription();

      if (subscription) {
        console.log(
          "Existing push subscription found:"
        );
        console.log(subscription);

        console.log(
          "Subscription JSON:",
          JSON.stringify(subscription)
        );

        return;
      }

      // Create a new push subscription.
      subscription =
        await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey,
        });

      console.log(
        "Push subscription created successfully:"
      );

      console.log(subscription);

      console.log(
        "Subscription JSON:",
        JSON.stringify(subscription)
      );

    } catch (error) {
      console.error(
        "Push subscription failed:",
        error
      );

      console.error("Error name:", error.name);
      console.error("Error message:", error.message);
      console.error("Error stack:", error.stack);
    }
  }

  // Register the service worker.
  async function registerServiceWorker() {
    if (!("serviceWorker" in navigator)) {
      console.error(
        "Service workers are not supported."
      );
      return;
    }

    try {
      const registration =
        await navigator.serviceWorker.register("./sw.js");

      console.log(
        "Service worker registered successfully:",
        registration
      );

      console.log(
        "Scope:",
        registration.scope
      );

    } catch (error) {
      console.error(
        "Service worker registration failed:",
        error
      );
    }
  }

  document
    .getElementById("subscribeButton")
    .addEventListener("click", subscribe);

  window.addEventListener("load", registerServiceWorker);
</script>

</body> </html>
